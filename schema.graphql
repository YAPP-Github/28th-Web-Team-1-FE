}

"""FREE 형식의 경험 상세 내용 입력입니다."""
input FreeExperienceContentsRequest {
  """자유 내용입니다."""
  content: String!
}

"""JD입니다."""
type Jd {
  """기업/팀 소개입니다."""
  companyIntro: String!

  """기업 이름입니다. (추출 실패 시 빈 문자열)"""
  companyName: String!

  """핵심 역량 태그입니다. AI가 공고에서 추출한 상위 핵심 역량(최대 5개). 아카이브 카드용."""
  coreCompetencies: [String!]!

  """등록일입니다. (ISO-8601)"""
  createdAt: String

  """전형 절차 목록입니다."""
  hiringProcess: [String!]!

  """등록 시 AI가 생성해 저장한 공고 핵심과 지원 전략입니다."""
  insight: JdInsight!

  """JD를 식별하는 ID입니다."""
  jdId: ID!

  """포지션 이름입니다. (추출 실패 시 빈 문자열)"""
  positionTitle: String!

  """우대 경험 목록입니다."""
  preferredExperiences: [String!]!

  """필요 경험(자격요건) 목록입니다."""
  requiredExperiences: [String!]!

  """업무 내용 목록입니다."""
  responsibilities: [String!]!

  """등록에 사용된 공고 원문입니다. 원문 조회 화면용이며, 기능 이전에 등록된 JD는 null입니다."""
  sourceBody: String

  """원본 공고 URL입니다. (붙여넣기 등록이면 null)"""
  sourceUrl: String

  """이력서 생성 진행 상태입니다. (AR0001 진행 중/완료 섹션 구분)"""
  status: JdStatus!
}

"""다중 공고 후보입니다."""
type JdCandidate {
  """공고 원문 본문입니다. (재등록 시 body로 전달)"""
  body: String!

  """공고 제목입니다. (없으면 빈 문자열)"""
  title: String!
}

"""JD의 AI 인사이트입니다."""
type JdInsight {
  """공고 핵심입니다. 공고가 원하는 인재상/핵심 요구를 요약한 서술형 문단입니다."""
  keyPoints: String!

  """지원 전략입니다. 어떤 경험을 어떻게 강조하면 좋을지 조언하는 서술형 문단입니다."""
  strategy: String!
}

"""
JD 등록 입력입니다. sourceUrl 또는 body 중 하나는 필요합니다.
body가 있으면 크롤 없이 body로 처리하고, sourceUrl은 출처 메타로만 저장됩니다.
"""
input JdRegisterRequest {
  """붙여넣은 JD 본문입니다. (붙여넣기 등록)"""
  body: String = null

  """등록할 JD 공고의 URL입니다. (크롤 등록)"""
  sourceUrl: String = null
}

"""JD 등록 결과입니다. 단일 공고면 jd, 다중 공고면 candidates가 채워집니다."""
type JdRegisterResult {
  """저장되지 않은 공고 후보 목록입니다. (다중 공고 - 하나를 골라 body로 재등록)"""
  candidates: [JdCandidate!]

  """등록된 JD입니다. (단일 공고)"""
  jd: Jd
}

"""JD 목록 정렬 기준입니다."""
enum JdSortType {
  """최신순(등록 역순)입니다."""
  LATEST

  """회사명 가나다순입니다."""
  NAME
}

"""JD의 이력서 생성 진행 상태입니다."""
enum JdStatus {
  """연결된 이력서 생성 완료입니다."""
  COMPLETED

  """이력서 미완성(등록 직후 기본)입니다."""
  IN_PROGRESS
}

"""64-bit signed integer"""
scalar Long

type Mutation {
  """워크스페이스에 Notion을 연결합니다."""
  connectNotion(
    """Notion 연결 요청입니다."""
    request: ConnectNotionRequest!

    """Notion을 연결할 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): NotionConnection!

  """경험을 생성합니다."""
  createExperience(
    """생성할 경험 정보입니다."""
    request: CreateExperienceRequest!

    """경험을 생성할 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Experience!

  """경험 프로젝트를 생성합니다."""
  createExperienceProject(
    """생성할 경험 프로젝트 정보입니다."""
    input: CreateExperienceProjectRequest!

    """경험 프로젝트를 생성할 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): ExperienceProject!

  """새 이력서를 전체 스냅샷 단위로 생성합니다."""
  createResume(
    """생성할 이력서 전체 스냅샷입니다."""
    input: CreateResumeInput!

    """이력서를 생성할 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Resume!

  """경험을 삭제합니다."""
  deleteExperience(
    """삭제할 경험 ID입니다."""
    experienceId: ID!

    """경험이 속한 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Boolean!

  """경험 프로젝트를 삭제합니다."""
  deleteExperienceProject(
    """삭제할 경험 프로젝트 ID입니다."""
    projectId: ID!

    """경험 프로젝트가 속한 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Boolean!

  """
  JD를 삭제합니다. 연관된 AI 인사이트/경험 추천 캐시도 함께 영구 삭제됩니다.
  워크스페이스 밖 JD면 오류를 반환합니다.
  """
  deleteJd(
    """삭제할 JD의 ID입니다."""
    id: ID!

    """JD가 속한 워크스페이스의 ID입니다."""
    workspaceId: ID!
  ): Boolean!

  """이력서를 삭제합니다."""
  deleteResume(
    """삭제할 이력서 ID입니다."""
    resumeId: ID!

    """이력서가 속한 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Boolean!

  """워크스페이스에서 Notion 연결을 해제합니다."""
  disconnectNotion(
    """Notion 연결 ID입니다."""
    connectionId: ID!

    """Notion 연결이 속한 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Boolean!

  """프로필 정보(경력/프로젝트/스킬)를 바탕으로 핵심역량을 AI로 생성합니다. 결과만 반환하고 저장하지 않습니다."""
  generateCoreCompetency(
    """워크스페이스 ID입니다."""
    workspaceId: ID!
  ): String!

  """Notion 페이지 내용을 경험으로 가져옵니다."""
  importNotionExperiences(
    """Notion 경험 가져오기 요청입니다."""
    request: NotionExperienceImportRequest!

    """경험을 가져올 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Boolean!

  """
  이력서 생성이 완료된 JD를 완료 상태(COMPLETED)로 전환합니다. (AR0001 진행 중 -> 완료)
  이미 완료면 그대로 반환하며, 워크스페이스 밖 JD면 오류를 반환합니다.
  """
  markJdCompleted(
    """완료 처리할 JD의 ID입니다."""
    id: ID!

    """JD가 속한 워크스페이스의 ID입니다."""
    workspaceId: ID!
  ): Jd!

  """Free Style 경험 내용을 STAR 형식으로 다듬습니다."""
  polishExperienceContents(
    """STAR 형식으로 변환할 Free Style 경험 내용입니다."""
    request: PolishExperienceContentsRequest!
  ): StarExperienceContents!

  """프로필 텍스트(핵심역량/경력 세부/경험명/STAR 설명)를 AI로 다듬습니다. 결과만 반환하고 저장하지 않습니다."""
  polishProfileText(
    """텍스트 다듬기 입력입니다."""
    request: PolishProfileTextRequest!
  ): String!

  """
  JD를 URL(크롤) 또는 붙여넣기(본문)로 등록합니다.
  본문에 여러 공고가 있으면 저장하지 않고 후보 목록(candidates)을 반환하고,
  하나면 7필드(기업명/포지션/소개/업무/필요/우대경험/전형절차)를 추출/저장해 jd를 반환합니다.
  크롤/추출 실패 시 오류를 반환합니다.
  """
  registerJd(
    """
    등록 입력입니다. body가 있으면 크롤 없이 body로 등록하고 sourceUrl은 출처로만 저장합니다.
    body가 없으면 sourceUrl을 크롤해 등록합니다.
    """
    request: JdRegisterRequest!

    """등록할 워크스페이스의 ID입니다."""
    workspaceId: ID!
  ): JdRegisterResult!

  """경험을 수정합니다."""
  updateExperience(
    """수정할 경험 ID입니다."""
    experienceId: ID!

    """수정할 경험 정보입니다."""
    request: UpdateExperienceRequest!

    """경험이 속한 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Experience!

  """경험 프로젝트를 수정합니다."""
  updateExperienceProject(
    """수정할 경험 프로젝트 ID입니다."""
    projectId: ID!

    """수정할 경험 프로젝트 정보입니다."""
    request: UpdateExperienceProjectRequest!

    """경험 프로젝트가 속한 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): ExperienceProject!

  """
  이력서 기본 정보 프로필을 수정합니다. null 필드는 미변경, 섹션 리스트는 전체 교체됩니다 (빈 리스트 = 비우기, 배열 순서 = 노출 순서).
  """
  updateProfile(
    """수정할 프로필 정보입니다."""
    request: UpdateProfileRequest!

    """프로필이 속한 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Profile!

  """기존 이력서를 전체 스냅샷 단위로 수정합니다."""
  updateResume(
    """수정할 이력서 전체 스냅샷입니다."""
    input: SaveResumeInput!

    """수정할 이력서 ID입니다."""
    resumeId: ID!

    """이력서가 속한 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Resume!
}

"""Notion 연결입니다."""
type NotionConnection {
  """Notion 연결 ID입니다."""
  connectionId: ID!

  """Notion 워크스페이스 아이콘 URL입니다."""
