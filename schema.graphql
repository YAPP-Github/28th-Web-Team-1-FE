  """경험 수행 기간입니다."""
  period: PeriodInput

  """연결할 경험 프로젝트 ID입니다."""
  projectId: ID!

  """경험에서 맡은 역할입니다."""
  role: String

  """경험에 부여할 태그 목록입니다."""
