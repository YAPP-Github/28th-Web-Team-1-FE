    """특정 프로젝트의 경험만 조회할 때 사용하는 프로젝트 ID입니다 (선택)"""
    projectId: ID

    """한 번에 조회할 경험 개수입니다. (1 이상 30 이하)"""
    size: Int!

    """경험 목록을 조회할 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Experiences!

  """인증된 사용자의 정보를 조회합니다."""
  me: User!

  """워크스페이스에 연결된 Notion 연결 목록을 조회합니다."""
  notionConnections(
    """다음 페이지를 조회할 때 사용하는 커서입니다. (첫 페이지는 null)"""
    cursor: String

    """한 번에 조회할 Notion 연결 개수입니다. (1 이상 30 이하)"""
    size: Int!

    """워크스페이스 ID입니다."""
    workspaceId: ID!
  ): NotionConnections!

  """연결된 Notion 워크스페이스에서 페이지를 검색합니다."""
  notionPages(
    """Notion 연결 ID입니다."""
    connectionId: ID!

    """다음 페이지를 조회할 때 사용하는 Notion 커서입니다. (첫 페이지는 null)"""
    cursor: String

    """페이지 검색어입니다 (선택)"""
    query: String

    """한 번에 조회할 Notion 페이지 개수입니다. (1 이상 100 이하)"""
    size: Int!

    """워크스페이스 ID입니다."""
    workspaceId: ID!
  ): NotionPages!

  """이력서 상세를 조회합니다."""
  resume(
    """조회할 이력서 ID입니다."""
    resumeId: ID!

    """이력서가 속한 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Resume!

  """워크스페이스의 이력서 수를 상태별로 조회합니다."""
  resumeCounts(
    """이력서 수를 조회할 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): [ResumeStatusCount!]!

  """워크스페이스의 이력서 목록을 조회합니다."""
  resumes(
    """조회할 이력서 상태 목록입니다 (생략하면 COMPLETED, DRAFT를 모두 조회)"""
