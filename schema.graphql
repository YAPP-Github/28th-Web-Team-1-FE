"""Notion 페이지 목록입니다."""
type NotionPages {
  """다음 페이지 조회에 사용하는 커서 정보입니다."""
  cursor: Cursor!

  """조회된 Notion 페이지 목록입니다."""
  pages: [NotionPageSummary!]!
}

"""기간입니다."""
type Period {
  """기간 종료일입니다."""
  endAt: String

  """기간 시작일입니다."""
  startAt: String
}

"""기간 입력입니다."""
input PeriodInput {
  """기간 종료일입니다."""
  endAt: String

  """기간 시작일입니다."""
  startAt: String
}

"""경험 내용 AI 다듬기 입력입니다."""
input PolishExperienceContentsRequest {
  """STAR 형식으로 변환할 자유 서술 경험 내용입니다."""
  content: String!
}

"""프로필 텍스트 AI 다듬기 입력입니다."""
input PolishProfileTextRequest {
