type Query {
  """경험 단건을 조회합니다."""
  experience(
    """조회할 경험 ID입니다."""
    experienceId: ID!

    """경험을 조회할 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Experience

  """경험 프로젝트 단건을 조회합니다."""
  experienceProject(
    """조회할 경험 프로젝트 ID입니다."""
    projectId: ID!

    """경험 프로젝트가 속한 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): ExperienceProject!

  """경험 프로젝트 목록을 조회합니다."""
  experienceProjects(
    """다음 페이지를 조회할 때 사용하는 커서입니다. (첫 페이지는 null)"""
    cursor: String = null

    """한 번에 조회할 경험 프로젝트 개수입니다. (1 이상 30 이하)"""
    size: Int! = 10

    """경험 프로젝트 목록을 조회할 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): ExperienceProjects!

  """경험 목록을 조회합니다 (프로젝트 ID가 있는 경우 특정 프로젝트 내로 한정)"""
  experiences(
    """다음 페이지를 조회할 때 사용하는 커서입니다. (첫 페이지는 null)"""
    cursor: String = null

    """JD ID입니다. 주면 각 경험에 해당 JD 기준 matchRate와 reason(상위 5개)을 채웁니다. (선택)"""
    jdId: ID = null

    """특정 프로젝트의 경험만 조회할 때 사용하는 프로젝트 ID입니다 (선택)"""
    projectId: ID = null

    """한 번에 조회할 경험 개수입니다. (1 이상 30 이하)"""
    size: Int! = 10

    """경험 목록을 조회할 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Experiences!

  """등록된 JD 단건을 조회합니다."""
  jd(
    """조회할 JD의 ID입니다."""
    id: ID!

    """조회할 워크스페이스의 ID입니다."""
    workspaceId: ID!
  ): Jd

  """
  JD의 AI 인사이트를 조회합니다.
  하위 호환을 위한 독립 조회 API이며, 신규 API에서는 jd.insight를 사용할 수 있습니다.
  """
  jdInsight(
    """조회할 JD의 ID입니다."""
    jdId: ID!

    """조회할 워크스페이스의 ID입니다."""
    workspaceId: ID!
  ): JdInsight

  """워크스페이스의 JD 목록을 조회합니다."""
  jds(
    """정렬 기준입니다. LATEST(최신순, 기본값) 또는 NAME(회사명 가나다순)."""
    sort: JdSortType! = LATEST

    """상태 필터입니다. 생략하면 전체, IN_PROGRESS/COMPLETED면 해당 상태만. (AR0001 진행 중/완료 섹션)"""
    status: JdStatus = null

    """조회할 워크스페이스의 ID입니다."""
    workspaceId: ID!
  ): [Jd!]!

  """인증된 사용자의 정보를 조회합니다."""
  me: User!

  """워크스페이스에 연결된 Notion 연결 목록을 조회합니다."""
  notionConnections(
    """다음 페이지를 조회할 때 사용하는 커서입니다. (첫 페이지는 null)"""
    cursor: String = null

    """한 번에 조회할 Notion 연결 개수입니다. (1 이상 30 이하)"""
    size: Int! = 10

    """워크스페이스 ID입니다."""
    workspaceId: ID!
  ): NotionConnections!

  """연결된 Notion 워크스페이스에서 페이지를 검색합니다."""
  notionPages(
    """Notion 연결 ID입니다."""
    connectionId: ID!

    """다음 페이지를 조회할 때 사용하는 Notion 커서입니다. (첫 페이지는 null)"""
    cursor: String = null

    """페이지 검색어입니다 (선택)"""
    query: String = null

    """한 번에 조회할 Notion 페이지 개수입니다. (1 이상 100 이하)"""
    size: Int! = 10

    """워크스페이스 ID입니다."""
    workspaceId: ID!
  ): NotionPages!

  """이력서 기본 정보 프로필을 조회합니다. 프로필이 없으면 빈 프로필을 생성해 반환합니다. (워크스페이스당 1개)"""
  profile(
    """프로필을 조회할 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Profile!

  """이력서 상세를 조회합니다."""
  resume(
    """조회할 이력서 ID입니다."""
    resumeId: ID!

    """이력서가 속한 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Resume!

  """워크스페이스의 이력서 수를 상태별로 조회합니다."""
  resumeCounts(
    """이력서 수를 조회할 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): [ResumeStatusCount!]!

  """워크스페이스의 이력서 목록을 조회합니다."""
  resumes(
    """다음 페이지를 조회할 때 사용할 커서입니다."""
    cursor: String = null

    """한 번에 조회할 이력서 개수입니다. (1 이상 30 이하)"""
    size: Int! = 10

    """조회할 이력서 상태 목록입니다 (생략하면 COMPLETED, DRAFT를 모두 조회)"""
    statuses: [ResumeStatusType!] = null

    """이력서 목록을 조회할 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Resumes!

  """키워드 기반으로 경험 목록을 검색합니다."""
  searchExperiences(
    """다음 페이지를 조회할 때 사용하는 커서입니다. (첫 페이지는 null)"""
    cursor: String = null

    """검색어입니다."""
    keyword: String!

    """한 번에 조회할 경험 개수입니다. (1 이상 30 이하)"""
    size: Int! = 10

    """경험을 검색할 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Experiences!
}

