type Mutation {
  """워크스페이스에 Notion을 연결합니다."""
  connectNotion(
    """Notion 연결 요청입니다."""
    request: ConnectNotionRequest!

    """Notion을 연결할 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): NotionConnection!

  """경험을 생성합니다."""
  createExperience(
    """생성할 경험 정보입니다."""
    request: CreateExperienceRequest!

    """경험을 생성할 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Experience!

  """경험 프로젝트를 생성합니다."""
  createExperienceProject(
    """생성할 경험 프로젝트 정보입니다."""
    input: CreateExperienceProjectRequest!

    """경험 프로젝트를 생성할 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): ExperienceProject!

  """새 이력서를 전체 스냅샷 단위로 생성합니다."""
  createResume(
    """생성할 이력서 전체 스냅샷입니다."""
    input: SaveResumeInput!

    """이력서를 생성할 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Resume!

  """경험을 삭제합니다."""
  deleteExperience(
    """삭제할 경험 ID입니다."""
    experienceId: ID!

    """경험이 속한 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Boolean!

  """경험 프로젝트를 삭제합니다."""
  deleteExperienceProject(
    """삭제할 경험 프로젝트 ID입니다."""
    projectId: ID!

    """경험 프로젝트가 속한 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Boolean!

  """이력서를 삭제합니다."""
  deleteResume(
    """삭제할 이력서 ID입니다."""
    resumeId: ID!

    """이력서가 속한 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Boolean!

  """워크스페이스에서 Notion 연결을 해제합니다."""
  disconnectNotion(
    """Notion 연결 ID입니다."""
    connectionId: ID!

    """Notion 연결이 속한 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Boolean!

  """Notion 페이지 내용을 경험으로 가져옵니다."""
  importNotionExperiences(
    """Notion 경험 가져오기 요청입니다."""
    request: NotionExperienceImportRequest!

    """경험을 가져올 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Boolean!

  """Free Style 경험 내용을 STAR 형식으로 다듬습니다."""
  polishExperienceContents(
    """STAR 형식으로 변환할 Free Style 경험 내용입니다."""
    request: PolishExperienceContentsRequest!
  ): StarExperienceContents!

  """경험을 수정합니다."""
  updateExperience(
    """수정할 경험 ID입니다."""
    experienceId: ID!

    """수정할 경험 정보입니다."""
    request: UpdateExperienceRequest!

    """경험이 속한 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Experience!

  """경험 프로젝트를 수정합니다."""
  updateExperienceProject(
    """수정할 경험 프로젝트 ID입니다."""
    projectId: ID!

    """수정할 경험 프로젝트 정보입니다."""
    request: UpdateExperienceProjectRequest!

    """경험 프로젝트가 속한 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): ExperienceProject!

  """기존 이력서를 전체 스냅샷 단위로 수정합니다."""
  updateResume(
    """수정할 이력서 전체 스냅샷입니다."""
    input: SaveResumeInput!

    """수정할 이력서 ID입니다."""
    resumeId: ID!

    """이력서가 속한 워크스페이스 ID입니다."""
    workspaceId: ID!
  ): Resume!
}

