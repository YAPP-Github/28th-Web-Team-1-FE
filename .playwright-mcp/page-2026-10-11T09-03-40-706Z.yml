                      - /placeholder: 채용 공고 원문을 복사해 붙여넣어 주세요. 회사명, 직무 요건, 우대사항이 포함될수록 분석 정확도가 높아져요.
                      - text: "[테스트회사] 프론트엔드 개발자 채용 공고 회사 소개 테스트회사는 취업 준비생과 이직을 준비하는 직장인을 위해 AI 기반 이력서 작성 서비스를 만드는 스타트업입니다. 사용자가 가진 경험을 구조화하고, 지원하는 채용 공고에 맞춰 가장 적합한 경험을 추천하여 이력서 작성 시간을 크게 줄여주는 것을 목표로 합니다. 현재 누적 사용자 10만 명을 돌파했으며, 빠르게 성장하는 팀에서 함께 제품을 만들어 갈 프론트엔드 개발자를 찾고 있습니다. 주요 업무 - React와 Next.js App Router 기반의 웹 서비스 개발 및 운영 - 디자인 시스템 구축 및 공용 컴포넌트 라이브러리 관리 - GraphQL API 연동 및 TanStack Query를 활용한 서버 상태 관리 - 웹 성능 최적화(Core Web Vitals 개선, 번들 사이즈 관리) - 디자이너, 백엔드 개발자, PM과 협업하여 신규 기능 기획 및 개발 자격 요건 - TypeScript를 능숙하게 다룰 수 있는 분 - React 기반 웹 서비스 개발 실무 경험 1년 이상 또는 그에 준하는 프로젝트 경험이 있는 분 - REST 또는 GraphQL API 연동 경험이 있는 분 - Git을 활용한 협업 및 코드 리뷰 문화에 익숙한 분 우대 사항 - Next.js App Router와 서버 컴포넌트 사용 경험이 있는 분 - Feature-Sliced Design 등 프론트엔드 아키텍처 설계 경험이 있는 분 - 테스트 코드(Vitest, Playwright) 작성 경험이 있는 분 - 웹 접근성과 시맨틱 마크업에 대한 이해가 있는 분 - Sentry, Amplitude 등 모니터링 및 분석 도구 사용 경험이 있는 분 근무 조건 - 정규직, 서울 강남구, 주 2회 재택근무 가능 - 연봉 협의, 스톡옵션 제공"
